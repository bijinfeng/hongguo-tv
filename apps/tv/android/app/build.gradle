import groovy.json.JsonSlurper

plugins { id 'com.android.application' }

def appMetadata = new JsonSlurper().parse(file('../../nsh.json'))
def toolchain = new JsonSlurper().parse(file('../../../../tooling/tv-toolchain.json'))
def generated = file('../../.nsh/android-host')

android {
    namespace 'dev.hongguo.tv'
    compileSdk Integer.parseInt(toolchain.android.platform.substring(8))
    buildToolsVersion toolchain.android.buildTools
    ndkVersion toolchain.android.ndk
    defaultConfig {
        applicationId appMetadata.id
        minSdk toolchain.android.minSdk
        targetSdk toolchain.android.targetSdk
        versionCode appMetadata.build
        versionName appMetadata.version
        testInstrumentationRunner 'dev.hongguo.tv.T0Acceptance'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        assets.srcDir new File(generated, 'assets')
        jniLibs.srcDir new File(generated, 'jni')
        res.srcDir new File(generated, 'res')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    lint {
        warningsAsErrors = true
        // Tool versions are pinned for reproducibility; upgrades are a separate change.
        disable 'AndroidGradlePluginVersion'
    }
}

// Official embedding classes; the matching mixed libnsh.so comes from NSH package.
dependencies { implementation files(new File(generated, 'nsh-classes.jar')) }
