name: Release preview

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact commit to build; defaults to the selected ref'
        required: false
        type: string
      target:
        description: 'Platform to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - desktop
          - tv
          - windows
          - linux

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-preview:
    if: inputs.target == 'all' || inputs.target == 'desktop'
    name: Desktop preview (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: pnpm setup:workspace
      - name: Build the native desktop preview
        env:
          HONGGUO_RUNTIME_MODE: native
        run: pnpm package:desktop
      - name: Archive and describe preview
        env:
          PREVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          mkdir -p "$RUNNER_TEMP/release-preview"
          archive="$RUNNER_TEMP/release-preview/hongguo-desktop-preview-${version}-macos-aarch64.tar.gz"
          tar -C apps/desktop/.nsh/out -czf "$archive" 红果.app
          sha=$(git rev-parse HEAD)
          node - "$archive" "$RUNNER_TEMP/release-preview/candidate.json" <<'NODE'
          const fs = require('node:fs');
          const [artifact, output] = process.argv.slice(2);
          const url = process.env.PREVIEW_URL;
          fs.writeFileSync(output, JSON.stringify({
            channel: 'preview',
            artifacts: [{ target: 'desktop-macos-aarch64', path: artifact, url, kind: 'preview' }],
          }, null, 2));
          NODE
          pnpm release:record \
            --input "$RUNNER_TEMP/release-preview/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --out "$RUNNER_TEMP/release-preview/release.json" \
            --checksums "$RUNNER_TEMP/release-preview/SHA256SUMS"
      - name: Upload desktop preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hongguo-desktop-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/release-preview
          if-no-files-found: error
          retention-days: 14

  windows-preview:
    if: inputs.target == 'all' || inputs.target == 'windows'
    name: Desktop preview (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        shell: pwsh
        run: |
          $env:NSH_VERSION = "v$((Get-Content .nsh-version -Raw).Trim())"
          Invoke-WebRequest https://nsh.dev/install.ps1 -OutFile "$env:RUNNER_TEMP\nsh-install.ps1"
          & "$env:RUNNER_TEMP\nsh-install.ps1"
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\nsh\bin"
          "NSH_BIN=$env:LOCALAPPDATA\nsh\bin\nsh.exe" | Add-Content $env:GITHUB_ENV
      - run: pnpm setup:workspace
      - name: Build the native desktop preview
        env:
          HONGGUO_RUNTIME_MODE: native
        run: pnpm package:desktop
      - name: Archive the Windows preview
        shell: pwsh
        run: |
          $out = 'apps/desktop/.nsh/out'
          Get-ChildItem $out
          $version = (Get-Content product-version.json -Raw | ConvertFrom-Json).version
          $dir = Join-Path $env:RUNNER_TEMP 'release-preview'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $archive = Join-Path $dir "hongguo-desktop-preview-$version-windows-x64.zip"
          # nsh package writes the runner directory and its own zip; prefer the ready-made one.
          $zip = Get-ChildItem $out -Filter *.zip -File | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName $archive
          } else {
            Compress-Archive -Path (Join-Path $out '红果') -DestinationPath $archive -Force
          }
          "PREVIEW_ARCHIVE=$archive" | Add-Content $env:GITHUB_ENV
      - name: Describe Windows preview
        env:
          PREVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          node - "$PREVIEW_ARCHIVE" "$RUNNER_TEMP/release-preview/candidate.json" <<'NODE'
          const fs = require('node:fs');
          const [artifact, output] = process.argv.slice(2);
          const url = process.env.PREVIEW_URL;
          fs.writeFileSync(output, JSON.stringify({
            channel: 'preview',
            artifacts: [{ target: 'desktop-windows-x64', path: artifact, url, kind: 'preview' }],
          }, null, 2));
          NODE
          pnpm release:record \
            --input "$RUNNER_TEMP/release-preview/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --out "$RUNNER_TEMP/release-preview/release.json" \
            --checksums "$RUNNER_TEMP/release-preview/SHA256SUMS"
      - name: Upload Windows desktop preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hongguo-desktop-preview-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/release-preview
          if-no-files-found: error
          retention-days: 14

  linux-preview:
    if: inputs.target == 'all' || inputs.target == 'linux'
    name: Desktop preview (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: pnpm setup:workspace
      - name: Build the native desktop preview
        env:
          HONGGUO_RUNTIME_MODE: native
        run: pnpm package:desktop
      - name: Archive and describe Linux preview
        env:
          PREVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out=apps/desktop/.nsh/out
          find "$out" -maxdepth 2
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          mkdir -p "$RUNNER_TEMP/release-preview"
          archive="$RUNNER_TEMP/release-preview/hongguo-desktop-preview-${version}-linux-x64.tar.gz"
          # nsh package writes the runner directory and its own archive; prefer the ready-made one.
          tgz=$(find "$out" -maxdepth 1 -name '*.tar.gz' | head -n 1)
          if [ -z "$tgz" ]; then
            tar -C "$out" -czf "$archive" 红果
          else
            cp "$tgz" "$archive"
          fi
          # Record the produced bundle's dynamic-library dependencies as acceptance evidence;
          # the ENGINEERING desktop-linux row requires the fixed GTK baseline to be visible.
          deps="$RUNNER_TEMP/release-preview/linux-dynamic-deps.txt"
          for exe in $(find "$out/红果" -maxdepth 1 -type f -executable); do
            printf '== %s\n' "$exe" >> "$deps"
            ldd "$exe" >> "$deps" 2>&1 || true
          done
          test -s "$deps"
          sha=$(git rev-parse HEAD)
          node - "$archive" "$RUNNER_TEMP/release-preview/candidate.json" <<'NODE'
          const fs = require('node:fs');
          const [artifact, output] = process.argv.slice(2);
          const url = process.env.PREVIEW_URL;
          fs.writeFileSync(output, JSON.stringify({
            channel: 'preview',
            artifacts: [{ target: 'desktop-linux-x64', path: artifact, url, kind: 'preview' }],
          }, null, 2));
          NODE
          pnpm release:record \
            --input "$RUNNER_TEMP/release-preview/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --out "$RUNNER_TEMP/release-preview/release.json" \
            --checksums "$RUNNER_TEMP/release-preview/SHA256SUMS"
      - name: Upload Linux desktop preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hongguo-desktop-preview-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/release-preview
          if-no-files-found: error
          retention-days: 14

  tv-preview:
    if: inputs.target == 'all' || inputs.target == 'tv'
    name: Android TV preview (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-tv
      - run: pnpm setup:workspace
      - name: Build the native TV preview
        env:
          HONGGUO_RUNTIME_MODE: native
        run: pnpm package:tv
      - name: Describe TV preview
        env:
          PREVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          mkdir -p "$RUNNER_TEMP/release-preview"
          archive="$RUNNER_TEMP/release-preview/hongguo-tv-preview-${version}-android-arm64.apk"
          cp apps/tv/.nsh/out/红果.apk "$archive"
          sha=$(git rev-parse HEAD)
          node - "$archive" "$RUNNER_TEMP/release-preview/candidate.json" <<'NODE'
          const fs = require('node:fs');
          const [artifact, output] = process.argv.slice(2);
          const url = process.env.PREVIEW_URL;
          fs.writeFileSync(output, JSON.stringify({
            channel: 'preview',
            artifacts: [{ target: 'tv-android-arm64', path: artifact, url, kind: 'preview' }],
          }, null, 2));
          NODE
          pnpm release:record \
            --input "$RUNNER_TEMP/release-preview/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --out "$RUNNER_TEMP/release-preview/release.json" \
            --checksums "$RUNNER_TEMP/release-preview/SHA256SUMS"
      - name: Upload TV preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hongguo-tv-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/release-preview
          if-no-files-found: error
          retention-days: 14
