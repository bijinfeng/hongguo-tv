name: TV release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact commit to build; defaults to the selected ref'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tv-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed Android TV candidate (arm64)
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: pnpm setup
      - name: Materialize signing keystore
        env:
          TV_RELEASE_KEYSTORE_BASE64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$TV_RELEASE_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/tv-release.jks"
          printf '%s' "$TV_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "TV_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          HONGGUO_RUNTIME_MODE: native
          HONGGUO_TV_BUILD_TYPE: release
          TV_RELEASE_STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          TV_RELEASE_KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
          TV_RELEASE_KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
        run: pnpm package:tv
      - name: Verify candidate identity and describe artifact
        env:
          TV_RELEASE_STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          TV_RELEASE_KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
          TV_RELEASE_KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          build=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('product-version.json')).build))")
          mkdir -p "$RUNNER_TEMP/tv-release-candidate"
          artifact="$RUNNER_TEMP/tv-release-candidate/hongguo-tv-${version}-android-arm64.apk"
          cp apps/tv/.nsh/out/红果.apk "$artifact"
          build_tools="$ANDROID_HOME/build-tools/$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('tooling/tv-toolchain.json')).android.buildTools)")"
          "$build_tools/apksigner" verify --verbose "$artifact"
          "$build_tools/aapt2" dump badging "$artifact" | grep -F "package: name='dev.hongguo.tv' versionCode='$build' versionName='$version'"
          cert=$(
            "$build_tools/apksigner" verify --print-certs "$artifact" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }'
          )
          test -n "$cert"
          sha=$(git rev-parse HEAD)
          node - "$artifact" "$RUNNER_TEMP/tv-release-candidate/candidate.json" "$version" "$cert" <<'NODE'
          const fs = require('node:fs');
          const [artifact, output, version, certificate] = process.argv.slice(2);
          const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/hongguo-tv-${version}-android-arm64.apk`;
          fs.writeFileSync(output, JSON.stringify({
            channel: 'stable',
            artifacts: [{
              target: 'tv-android-arm64',
              path: artifact,
              url,
              kind: 'installer',
              signingIdentity: `sha256:${certificate}`,
            }],
          }, null, 2));
          NODE
          pnpm release:record \
            --input "$RUNNER_TEMP/tv-release-candidate/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --out "$RUNNER_TEMP/tv-release-candidate/release.json" \
            --checksums "$RUNNER_TEMP/tv-release-candidate/SHA256SUMS"
          pnpm release:verify-record \
            --record "$RUNNER_TEMP/tv-release-candidate/release.json" \
            --artifact-dir "$RUNNER_TEMP/tv-release-candidate" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha"
      - name: Upload signed candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hongguo-tv-release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/tv-release-candidate
          if-no-files-found: error
          retention-days: 14
