name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      # Prebuilt binaries: compiling nextest from source cost 174-329s per platform.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.151
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      # Shares the target directory with the workspace job on macOS: both run the same clippy
      # and the same Rust crates behind `nsh check`, which was 446s of rebuilding without it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo nextest run --locked --workspace
      - run: cargo test --locked --workspace --doc
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ubuntu-24.04
      - run: pnpm doctor
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm codegen:check
      - run: pnpm release:check
      - name: Validate squash title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tooling/src/pr-title.mjs
      - run: pnpm test:tooling
      - run: pnpm check
      - run: pnpm build
  entry:
    # One runner per target: they each compile Rust and start an NSH engine, so sharing a
    # 3-4 core runner made them contend — serial was 1245s and three-in-one was worse.
    strategy:
      fail-fast: false
      matrix:
        target: [web, desktop, tv]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: entry-${{ matrix.target }}
      - name: Behavior in ${{ matrix.target }}
        working-directory: apps/${{ matrix.target }}
        run: '"$HOME/.local/bin/nsh" test'
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm security
  required:
    if: ${{ always() }}
    needs: [rust, workspace, entry, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          assert all(result == 'success' for result in json.loads(os.environ['RESULTS']))
          PY
