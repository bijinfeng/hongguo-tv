name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
# Line tables only, for every cargo build here. `dev` carries full debug info by default, which
# is the bulk of what the cache stores and the bulk of what a cold run writes: the app target
# alone is 11 GB of `deps`. Line tables keep backtraces readable — a test failure still names
# file and line — while cutting the archive the cache packs and restores on every job.
#
# Job-level on purpose: rust-cache hashes every `CARGO*` variable into its key, and it must, or
# a cache built with one debug level would be restored for a build expecting another. Cargo's
# own fingerprint would then rebuild everything the cache just paid to restore. Adding this
# variable therefore invalidates the caches saved before it, once; that was the state of the
# `entry-v2-*` entries on 2026-11-26 (`No cache found` on run 45745693501) and the next master
# run repopulates them under the new key.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides which jobs a change can reach. ENGINEERING §8 allows trimming the matrix once it
  # is stable: a documentation-only change has no binaries to build or run, so the whole
  # matrix would only be waiting on nothing. Everything whose reach is not provably limited
  # stays on the full matrix, so a wrong guess costs redundant work, never a missing gate.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      desktop: ${{ steps.select.outputs.desktop }}
      tv: ${{ steps.select.outputs.tv }}
      entry: ${{ steps.select.outputs.entry }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          # The range below needs the merge base, so the shallow default is not enough.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tooling/src/cli.mjs ci:jobs
  rust:
    needs: [scope, checks]
    if: needs.scope.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      # Prebuilt binaries: compiling nextest from source cost 174-329s per platform.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.151
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      # Shares the target directory with the workspace job on macOS: both run the same clippy
      # and the same Rust crates behind `nsh check`, which was 446s of rebuilding without it.
      # Only the master run writes. A pull request that saved would race the others for one key
      # and the 10 GB allowance cannot hold a generation per branch — the four generations it
      # came to hold were 12.4 GB, so every save evicted a cache someone else needed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo nextest run --locked --workspace
      - run: cargo test --locked --workspace --doc
  # The fast gates, alone on a shared runner and ahead of everything that compiles. Before
  # this split they were the first five steps of `workspace`, so a formatting slip still waited
  # for a Rust toolchain, a 20-30s cache restore and a pnpm install before anything looked at
  # it, and the twelve jobs below started at the same moment regardless. Everything expensive
  # now `needs: checks`, so a problem that costs seconds is reported in seconds and the runners
  # that would have queued behind it are never started. Nothing here needs nsh or cargo: the
  # bounds and the contract check read files, which is what keeps this job at about 40s.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `pnpm test:tooling` is not file-only: `update-manifest.test.mjs` and the archive tests
      # run `nsh update-manifest` against fixtures, and without this they fail with
      # `spawnSync nsh ENOENT` before any Rust work has started (run 45745109311). The
      # installer is one download, so the gate still lands far ahead of the compiling jobs.
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm codegen:check
      - run: pnpm release:check
      - name: Validate squash title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tooling/src/pr-title.mjs
      - run: pnpm test:tooling
  workspace:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: pnpm doctor:workspace
      - run: pnpm check
      - run: pnpm build
  entry:
    # One runner per target: they each compile Rust and start an NSH engine, so sharing a
    # 3-4 core runner made them contend — serial was 1245s and three-in-one was worse.
    # Desktop behavior additionally gates on the Windows and Linux hosts (the ENGINEERING
    # matrix's desktop-windows / desktop-linux rows); tv keeps the macOS host its development
    # flows run on. The harness is not in this matrix: it ships nothing, and `workspace` already
    # type-checks and builds it, so a browser-only suite does not deserve a runner of its own.
    name: ${{ matrix.target }} (${{ matrix.os }})
    needs: [scope, checks]
    # Each target's suite runs only when the change can reach that app; `scope` builds this
    # matrix because a job-level `if` cannot read `matrix`.
    if: needs.scope.outputs.entry != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.entry) }}
    runs-on: ${{ matrix.os }}
    # A cold run is the slowest legitimate outcome, and it has to fit: with NSH 0.7 and no
    # cache, `tv` on macOS compiled its crate for 9m33s and the headless runner for 13m19s
    # before the tests started, and the old 25-minute ceiling cancelled it at 25m22s while it
    # was still working (run 45632126021). A cache miss must cost time, never read as a
    # failure, so every host gets room for that path; warm runs finish far inside it.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 60 || matrix.os == 'ubuntu-24.04' && 45 || 45 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = "v$((Get-Content .nsh-version -Raw).Trim())"
          Invoke-WebRequest https://nsh.dev/install.ps1 -OutFile "$env:RUNNER_TEMP\nsh-install.ps1"
          & "$env:RUNNER_TEMP\nsh-install.ps1"
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\nsh\bin"
          "NSH_BIN=$env:LOCALAPPDATA\nsh\bin\nsh.exe" | Add-Content $env:GITHUB_ENV
      - name: Install pinned NSH (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Restore the Linux engine's GTK baseline packages
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt-archives
          # The package list only changes when the baseline below changes, so the key is the
          # step's own definition rather than a date that would expire the cache for free.
          key: apt-gtk-baseline-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install the Linux engine's GTK baseline
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The pinned NSH engine runs on GTK 4 and reports media through GStreamer; these are
          # the documented nsh.dev Linux baseline (GTK >= 4.14 on Ubuntu 24.04), not app code.
          # The runner's Ubuntu mirror transferred this closure at ~50 kB/s, which cost 975s of
          # this job's 1350s. Keeping the downloaded .debs in the cached archive directory lets
          # a warm run install them without touching the network.
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives"
          packages="libgtk-4-dev clang libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev"
          sudo apt-get update
          # A full cache hit needs no network at all: every archive the closure resolves to is
          # already in the directory. `--print-uris` reports that closure without downloading.
          missing=$(apt-get install --print-uris --no-install-recommends --yes $packages 2>/dev/null |
            sed -n "s/^'[^']*'.*\s\([^ ]*\.deb\)\s.*/\1/p" |
            while read -r name; do [ -f "$archives/$name" ] || echo missing; done | wc -l)
          echo "apt archives absent from the cache: $missing"
          # `runner.temp` is mode 0700 under the runner user, so the `_apt` sandbox user cannot
          # traverse it; apt runs as root into the archive directory instead. That leaves
          # root-owned `partial/` and `lock` files behind, which the cache's tar step (running
          # as the runner user) could not read, so the handover back is explicit.
          sudo apt-get install --no-install-recommends --yes \
            -o Dir::Cache::archives="$archives" \
            -o APT::Sandbox::User=root \
            -o APT::Keep-Downloaded-Packages=true \
            $packages
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      # `nsh` builds into `apps/<app>/target`, and the rust-cache step above only saves the
      # repository's `target/`: what it restored here held the cargo registry and none of this
      # job's own output, so the headless runner was rebuilt from zero on every run (5m35 on
      # macOS, 5m30 on Windows, 13m19 for TV once NSH changed). Naming that directory as a
      # cache directory instead is what makes it survive, because `cache-directories` entries
      # are archived as they are while the action prunes its workspace `target/` to packages
      # of the root workspace — and the runner, built from `apps/<app>/.nsh/rust`, is not one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # v2: the cache now also holds `apps/<app>/target`. `cache-directories` does not
          # contribute to the key, so leaving the old name would restore a cache without the
          # runner in it and then skip saving this one over the same key — every run cold
          # again, silently. The generation has to move with the contents.
          shared-key: entry-v2-${{ matrix.target }}-${{ matrix.os }}
          cache-directories: ${{ format('{0}/apps/{1}/target', github.workspace, matrix.target) }}
          # Only the master run writes, for the same reason as the rust job above: this cache
          # is the large one (the runner alone compresses to ~250 MB per app), so a generation
          # per pull request would evict itself before the next run could restore it.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Installs the pinned toolchain from rust-toolchain.toml before nsh reaches for cargo.
      - run: rustup show active-toolchain
      # `App.tsx` imports the gitignored `runtime.generated.json`; without it every test fails
      # to build. `nsh check`/`build` write it, but this job runs `nsh test` directly.
      - run: pnpm setup:runtime
      - name: Behavior in ${{ matrix.target }} on ${{ matrix.os }}
        working-directory: apps/${{ matrix.target }}
        run: nsh test
      # The cache entry above saves `apps/<app>/target`; a build that lands anywhere else would
      # make every run cold while all of this still passed.
      - name: Assert the runner landed in the cached directory
        working-directory: apps/${{ matrix.target }}
        run: |
          set -euo pipefail
          # Windows names it `...-test.exe`; `-type f` keeps the dep file beside it from
          # satisfying the check.
          found=$(find target/debug -maxdepth 1 -type f \( -name 'nsh-app-*-test' -o -name 'nsh-app-*-test.exe' \) -print -quit)
          if [ -z "$found" ]; then
            echo "::error::nsh did not build into apps/${{ matrix.target }}/target"
            find . .nsh -maxdepth 5 \( -name 'nsh-app-*-test' -o -name 'nsh-app-*-test.exe' \) -print 2>/dev/null
            exit 1
          fi
          echo "Headless runner: $found"
  security:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm security
  required:
    if: ${{ always() }}
    needs: [scope, checks, rust, workspace, entry, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate that had work to do
        env:
          # Named per job: `needs.*.result` flattens to an unlabelled array, which cannot say
          # which gate produced which result.
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          ENTRY_RESULT: ${{ needs.entry.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SELECTION: ${{ toJSON(needs.scope.outputs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {
              name: os.environ[f'{name.upper()}_RESULT']
              for name in ('scope', 'checks', 'rust', 'workspace', 'entry', 'security')
          }
          selection = json.loads(os.environ['SELECTION'] or '{}')
          # `scope` decides what runs, so a failed or missing decision invalidates the run.
          assert results['scope'] == 'success', 'the path scope could not be decided'
          # These always run once the scope succeeded.
          for name in ('checks', 'workspace', 'security'):
              assert results[name] == 'success', f'{name} did not pass: {results[name]}'
          # A skipped job is acceptable only where `scope` proved the change cannot reach it;
          # claiming something was needed but it did not run is a workflow mistake.
          needed = selection.get('rust') == 'true'
          assert results['rust'] == ('success' if needed else 'skipped'), (
              f"rust ran as {results['rust']} while needed={needed}"
          )
          matrix = json.loads(selection['entry'] or '{"include": []}')
          target_needed = bool(matrix['include'])
          assert results['entry'] == ('success' if target_needed else 'skipped'), (
              f"entry ran as {results['entry']} while targets_needed={target_needed}"
          )
          print('every applicable gate passed', selection)
          PY
