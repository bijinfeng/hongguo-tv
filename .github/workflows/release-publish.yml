name: Publish release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact commit to build and tag'
        required: true
        type: string
      tag:
        description: 'SemVer release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  quality:
    name: Verify the exact release source
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          test "$RELEASE_TAG" = "v$version"
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: pnpm setup:workspace
      - run: pnpm setup:tools
      - run: pnpm verify
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  security:
    name: Require release dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: pnpm security

  desktop:
    name: Build desktop archive (${{ matrix.platform }})
    needs: [quality, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-15
          - platform: windows-x86_64
            os: windows-2025
          - platform: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = "v$((Get-Content .nsh-version -Raw).Trim())"
          Invoke-WebRequest https://nsh.dev/install.ps1 -OutFile "$env:RUNNER_TEMP\nsh-install.ps1"
          & "$env:RUNNER_TEMP\nsh-install.ps1"
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\nsh\bin"
          "NSH_BIN=$env:LOCALAPPDATA\nsh\bin\nsh.exe" | Add-Content $env:GITHUB_ENV
      - name: Install pinned NSH (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Install the Linux engine's GTK baseline
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The pinned NSH engine's Linux host links GTK 4, WebKitGTK 6.0 and GStreamer; these
          # are the documented build packages (nsh.dev/zh-CN/docs/linux) on Ubuntu 24.04.
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libgtk-4-dev clang \
            libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: pnpm setup:workspace
      - name: Validate release identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          test "$RELEASE_TAG" = "v$version"
          pnpm release:check
      - name: Select the Xcode the macOS SDK headers compile against
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # The image's default Xcode 16.4 SDK breaks nsh-platform-apple's os_log.c
          # (os/log.h deprecation macros); the framework compiles against 16.3.
          test -d /Applications/Xcode_16.3.app
          sudo xcode-select -s /Applications/Xcode_16.3.app
          xcodebuild -version
      - name: Build desktop archive
        env:
          HONGGUO_RUNTIME_MODE: native
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          pnpm package:desktop
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          release_dir="$RUNNER_TEMP/desktop-release"
          mkdir -p "$release_dir"
          out=apps/desktop/.nsh/out
          case "$PLATFORM" in
            macos-aarch64)
              archive="$release_dir/hongguo-desktop-${version}-macos-aarch64.tar.gz"
              tar -C "$out" -czf "$archive" 红果.app
              ;;
            windows-x86_64)
              # NSH writes <name>.zip beside the runner directory with the archivable
              # metadata (icon, entry); that is the archive the updater expects.
              archive="$release_dir/hongguo-desktop-${version}-windows-x86_64.zip"
              cp "$out"/*.zip "$archive"
              ;;
            linux-x86_64)
              archive="$release_dir/hongguo-desktop-${version}-linux-x86_64.tar.gz"
              # nsh package writes its own archive beside the runner directory; copy it so
              # the release ships exactly the bytes NSH recorded permissions with.
              tgz=$(find "$out" -maxdepth 1 -name '*.tar.gz' | head -n 1)
              if [ -n "$tgz" ]; then
                cp "$tgz" "$archive"
              else
                tar -C "$out" -czf "$archive" 红果
              fi
              ;;
          esac
          # The updater stages exactly one top-level directory holding this app's bundle;
          # a runner that renamed or flattened it fails here, before anything is signed.
          node tooling/src/desktop-archive.mjs --archive "$archive" --platform "$PLATFORM"
      - name: Upload desktop archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-release
          if-no-files-found: error
          retention-days: 14

  desktop-manifest:
    name: Sign desktop update metadata
    needs: [desktop]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/desktop-platforms
          merge-multiple: true
      - name: Sign the three-platform update manifest
        env:
          DESKTOP_UPDATE_MANIFEST_KEY: ${{ secrets.DESKTOP_UPDATE_MANIFEST_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_UPDATE_MANIFEST_KEY"
          umask 077
          key="$RUNNER_TEMP/desktop-update.secret"
          printf '%s' "$DESKTOP_UPDATE_MANIFEST_KEY" > "$key"
          chmod 600 "$key"
          pnpm release:check
          # Records all three archives from the bytes each platform job built, then signs
          # one latest.json whose platform keys NSH looks up at runtime.
          node tooling/src/update-manifest.mjs desktop \
            --dir "$RUNNER_TEMP/desktop-platforms" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --key "$key"
      - name: Remove desktop signing material
        if: always()
        run: |
          node -e "require('node:fs').rmSync(process.env.RUNNER_TEMP + '/desktop-update.secret', { force: true })"
      - name: Upload desktop release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release
          path: ${{ runner.temp }}/desktop-platforms
          if-no-files-found: error
          retention-days: 14

  tv:
    name: Build signed TV release
    needs: [quality, security]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned NSH
        run: |
          curl --fail --silent --show-error --location https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
          NSH_VERSION="v$(cat .nsh-version)" sh "$RUNNER_TEMP/nsh-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-tv
      - run: pnpm setup:workspace
      - name: Validate release identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          test "$RELEASE_TAG" = "v$version"
          pnpm release:check
      - name: Materialize signing materials
        env:
          TV_RELEASE_KEYSTORE_BASE64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
          TV_UPDATE_MANIFEST_KEY: ${{ secrets.TV_UPDATE_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          test -n "$TV_RELEASE_KEYSTORE_BASE64"
          test -n "$TV_UPDATE_MANIFEST_KEY"
          umask 077
          keystore="$RUNNER_TEMP/tv-release.jks"
          printf '%s' "$TV_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "TV_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          key="$RUNNER_TEMP/tv-update.secret"
          printf '%s' "$TV_UPDATE_MANIFEST_KEY" > "$key"
          chmod 600 "$key"
          echo "TV_UPDATE_MANIFEST_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: Build signed TV APK
        env:
          HONGGUO_RUNTIME_MODE: native
          HONGGUO_TV_BUILD_TYPE: release
          RELEASE_TAG: ${{ inputs.tag }}
          TV_RELEASE_STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          TV_RELEASE_KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
          TV_RELEASE_KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm package:tv
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          build=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('product-version.json')).build))")
          release_dir="$RUNNER_TEMP/tv-release"
          artifact="$release_dir/hongguo-tv-${version}-android-arm64.apk"
          mkdir -p "$release_dir"
          cp apps/tv/.nsh/out/红果.apk "$artifact"
          build_tools="$ANDROID_HOME/build-tools/$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('tooling/tv-toolchain.json')).android.buildTools)")"
          "$build_tools/apksigner" verify --verbose "$artifact"
          "$build_tools/aapt2" dump badging "$artifact" > "$RUNNER_TEMP/tv-badging.txt"
          "$build_tools/apksigner" verify --print-certs "$artifact" > "$RUNNER_TEMP/tv-certificates.txt"
          "$build_tools/aapt2" dump badging "$artifact" | grep -F "package: name='dev.hongguo.tv' versionCode='$build' versionName='$version'"
          cert=$("$build_tools/apksigner" verify --print-certs "$artifact" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }')
          test -n "$cert"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/hongguo-tv-${version}-android-arm64.apk"
          sha=$(git rev-parse HEAD)
          node - "$artifact" "$release_dir/candidate.json" "$release_url" "$cert" <<'NODE'
          const fs = require('node:fs');
          const [artifact, output, url, certificate] = process.argv.slice(2);
          fs.writeFileSync(output, JSON.stringify({
            channel: 'stable',
            artifacts: [{
              target: 'tv-android-arm64',
              path: artifact,
              url,
              kind: 'installer',
              signingIdentity: `sha256:${certificate}`,
            }],
          }, null, 2));
          NODE
          pnpm release:record \
            --input "$release_dir/candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --out "$release_dir/tv-release.json" \
            --checksums "$release_dir/tv-SHA256SUMS"
          node tooling/src/update-manifest.mjs tv \
            --dir "$release_dir" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$sha" \
            --badging "$RUNNER_TEMP/tv-badging.txt" \
            --certificates "$RUNNER_TEMP/tv-certificates.txt" \
            --key "$TV_UPDATE_MANIFEST_KEY_FILE"
      - name: Remove TV signing materials
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const name of ['tv-release.jks', 'tv-update.secret']) {
            fs.rmSync(`${process.env.RUNNER_TEMP}/${name}`, { force: true });
          }
          NODE
      - name: Upload TV release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tv-release
          path: ${{ runner.temp }}/tv-release
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release and update metadata
    needs: [desktop-manifest, tv]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/release
      - name: Validate downloaded release evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          test "$RELEASE_TAG" = "v$version"
          node tooling/src/update-manifest.mjs verify \
            --desktop-dir "$RUNNER_TEMP/release/desktop-release" \
            --tv-dir "$RUNNER_TEMP/release/tv-release" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA"
      - name: Ensure release tag matches source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --silent ||
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${SOURCE_SHA}" --silent
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')" = "$SOURCE_SHA"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('product-version.json')).version)")
          desktop="$RUNNER_TEMP/release/desktop-release"
          tv="$RUNNER_TEMP/release/tv-release"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Hongguo TV $version" \
            --notes "macOS, Windows and Linux desktop archives with signed update metadata, and the signed Android TV APK for $RELEASE_TAG."
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')" = "$SOURCE_SHA"
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$desktop/hongguo-desktop-${version}-macos-aarch64.tar.gz" \
            "$desktop/hongguo-desktop-${version}-windows-x86_64.zip" \
            "$desktop/hongguo-desktop-${version}-linux-x86_64.tar.gz" \
            "$tv/hongguo-tv-${version}-android-arm64.apk" \
            "$desktop/latest.json" \
            "$desktop/latest.json.sig" \
            "$tv/tv-latest.json" \
            "$tv/tv-latest.json.sig" \
            "$desktop/desktop-release.json#desktop-release.json" \
            "$desktop/desktop-SHA256SUMS#desktop-SHA256SUMS" \
            "$tv/tv-release.json#tv-release.json" \
            "$tv/tv-SHA256SUMS#tv-SHA256SUMS"
          readback="$RUNNER_TEMP/release-readback"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$readback"
          node tooling/src/update-manifest.mjs verify \
            --desktop-dir "$readback" \
            --tv-dir "$readback" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Verify anonymous Release downloads
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/release-anonymous"
          mkdir -p "$downloaded"
          for file in "$RUNNER_TEMP/release-readback/"*; do
            asset=$(basename "$file")
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --retry 3 --max-time 120 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}" \
              --output "$downloaded/$asset"
            cmp "$file" "$downloaded/$asset"
          done
          node tooling/src/update-manifest.mjs verify \
            --desktop-dir "$downloaded" \
            --tv-dir "$downloaded" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA"
      - name: Promote verified Release to latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
