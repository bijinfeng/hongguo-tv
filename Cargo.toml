[workspace]
members = ["apps/tv/native", "crates/core", "crates/http-api", "services/web-api"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
hongguo-core = { path = "crates/core", version = "=0.1.0" }
hongguo-http-api = { path = "crates/http-api", version = "=0.1.0" }
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
aes = "=0.9.4"
cbc = { version = "=0.2.1", features = ["alloc", "block-padding"] }
md-5 = "=0.11.0"
flate2 = "=1.1.11"
ring = "=0.17.14"
utoipa = "=6.0.0"
tower = { version = "=0.5.3", features = ["util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
nsh-base = "=0.5.0"
nsh-core = "=0.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
