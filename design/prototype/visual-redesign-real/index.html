<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>红果短剧 · 跨端视觉预览</title>
    <link rel="stylesheet" href="assets/theater.css" />
    <style>
      .overview {
        max-width: 1160px;
        margin: auto;
        padding: 80px 35px 35px;
      }
      .overview > header {
        display: grid;
        grid-template-columns: 7fr 5fr;
        align-items: end;
        gap: 50px;
        margin-bottom: 64px;
      }
      .overview h1 {
        font: 400 clamp(40px, 5vw, 64px) / 1.4 var(--display-font);
        letter-spacing: 0.04em;
      }
      .overview header p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.9;
        max-width: 36ch;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 26px;
      }
      .entry {
        display: block;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 28px;
        background: var(--surface);
        min-width: 0;
      }
      .entry:hover {
        background: var(--raised);
        border-color: var(--muted);
      }
      .entry-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .entry h2 {
        font-size: 22px;
      }
      .entry .icon {
        width: 23px;
        height: 23px;
      }
      .entry p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 12px;
      }
      .entry-art {
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 25px;
        overflow: hidden;
      }
      .entry-art .mini-poster {
        width: 87px;
        aspect-ratio: 2/3;
        transform: rotate(6deg);
      }
      .entry-art .mini-poster:nth-child(2) {
        width: 115px;
        transform: rotate(-5deg);
      }
      .entry-art .poster-title {
        font-size: 22px;
      }
      .entry-art .poster-caption {
        font-size: 7px;
      }
      .entry-art .poster-mark {
        font-size: 6px;
      }
      .entry-art .poster-cover-note {
        display: none;
      }
      .entry .entry-art .icon {
        width: 80px;
        height: 80px;
        stroke-width: 0.8;
        color: var(--muted);
      }
      .palette-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 190px;
        height: 130px;
      }
      .palette-pair span {
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg);
        font-family: var(--display-font);
        font-size: 26px;
      }
      .palette-pair span + span {
        background: #fff;
        color: #171717;
      }
      @media (max-width: 650px) {
        .overview {
          padding: 40px 20px;
        }
        .overview > header {
          grid-template-columns: 1fr;
          gap: 20px;
          margin-bottom: 35px;
        }
        .overview h1 {
          font-size: 42px;
        }
        .preview-grid {
          grid-template-columns: 1fr;
        }
        .entry {
          padding: 24px;
        }
        .entry-art {
          height: 160px;
        }
        .overview > header p {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="overview" data-od-id="preview-overview">
      <header>
        <h1>红果短剧<br />发现好故事。</h1>
      </header>
      <div class="preview-grid">
        <a class="entry" href="desktop.html" data-od-id="open-desktop"
          ><div class="entry-art" id="entry-posters"></div>
          <div class="entry-head">
            <h2>Web / 桌面</h2>
            <i data-icon="arrow-up-right"></i>
          </div></a
        ><a class="entry" href="tv.html" data-od-id="open-tv"
          ><div class="entry-art"><i data-icon="tv"></i></div>
          <div class="entry-head">
            <h2>Android TV</h2>
            <i data-icon="arrow-up-right"></i>
          </div></a
        ><a class="entry" href="components.html" data-od-id="open-components"
          ><div class="entry-art">
            <div class="palette-pair"><span>深色</span><span>浅色</span></div>
          </div>
          <div class="entry-head">
            <h2>组件与状态</h2>
            <i data-icon="arrow-up-right"></i>
          </div></a
        >
      </div>
    </main>
    <script src="assets/catalog.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/inspect.js"></script>
    <script>
      document.querySelector("#entry-posters").innerHTML = Theater.dramas
        .slice(0, 3)
        .map((d) => '<div class="mini-poster">' + Theater.poster(d) + "</div>")
        .join("");
    </script>
  </body>
</html>
