<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>红果短剧 · 桌面预览</title>
    <link rel="stylesheet" href="assets/theater.css" />
  </head>
  <body data-device="desktop">
    <div id="preview-nav"></div>
    <div class="app-shell" data-od-id="desktop-shell">
      <aside class="sidebar" data-od-id="sidebar">
        <a class="brand" href="desktop.html" aria-label="红果短剧首页"
          ><span class="brand-lockup"><img
            class="brand-logo brand-logo-base"
            src="assets/media/brand-logo.png"
            width="216"
            height="64"
            alt="红果短剧"
          /><img
            class="brand-logo brand-logo-color"
            src="assets/media/brand-logo.png"
            width="216"
            height="64"
            alt=""
            aria-hidden="true"
          /></span></a>
        <nav class="side-nav" aria-label="主要导航">
          <button
            class="nav-item active"
            data-route="home"
            data-od-id="nav-discover"
          >
            <i data-icon="house"></i><span>发现</span>
          </button>
          <button class="nav-item" data-route="feed" data-od-id="nav-feed">
            <i data-icon="list-video"></i><span>刷剧</span>
          </button>
          <button class="nav-item" data-route="browse" data-od-id="nav-browse">
            <i data-icon="search"></i><span>找剧</span>
          </button>
        </nav>
        <nav class="side-nav" aria-label="我的片单">
          <button
            class="nav-item"
            data-route="history"
            data-od-id="nav-history"
          >
            <i data-icon="history"></i><span>观看记录</span>
          </button>
          <button
            class="nav-item"
            data-route="favorites"
            data-od-id="nav-favorites"
          >
            <i data-icon="bookmark"></i><span>收藏</span>
          </button>
          <button
            class="nav-item"
            data-route="following"
            data-od-id="nav-following"
          >
            <i data-icon="bell"></i><span>追更</span>
          </button>
          <button
            class="nav-item"
            data-route="reservations"
            data-od-id="nav-reservations"
          >
            <i data-icon="calendar-days"></i><span>预约</span>
          </button>
        </nav>
        <div class="side-bottom">
          <button
            class="nav-item"
            data-route="account"
            data-od-id="nav-account"
          >
            <i data-icon="user-round"></i><span>我的账号</span>
          </button>
          <button
            class="nav-item"
            data-route="settings"
            data-od-id="nav-settings"
          >
            <i data-icon="settings-2"></i><span>设置</span>
          </button>
        </div>
      </aside>
      <div class="app-body">
        <header class="topbar" data-od-id="desktop-topbar">
          <span class="page-crumb" id="page-crumb">发现</span>
          <form class="search-form" id="search-form" role="search">
            <label class="input-wrap"
              ><i data-icon="search"></i
              ><input
                name="search"
                id="global-search"
                placeholder="搜索剧名、题材"
                aria-label="搜索剧名、题材"
              /><kbd class="keycap">⌘ K</kbd></label
            >
          </form>
          <button
            class="btn ghost icon-btn"
            data-action="theme"
            aria-label="切换浅深色"
            title="切换浅深色"
            data-od-id="theme-toggle"
          >
            <i data-icon="sun"></i></button
          ><button
            class="btn ghost icon-btn account-top"
            data-route="account"
            aria-label="我的账号"
          >
            <span class="avatar">观</span>
          </button>
        </header>
        <main
          class="main-content"
          id="main"
          tabindex="-1"
          data-od-id="desktop-main"
        ></main>
      </div>
    </div>
    <dialog
      id="app-dialog"
      class="dialog"
      aria-labelledby="dialog-title"
      data-od-id="dialog"
    ></dialog>
    <div id="toast-region" role="status" aria-live="polite"></div>
    <script src="assets/catalog.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/inspect.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
