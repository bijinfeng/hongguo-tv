<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <title>红果 TV · 设计原型</title>
    <link rel="stylesheet" href="shared/controls.css" />
    <link rel="stylesheet" href="shared/tv.css" />
    <link rel="stylesheet" href="assets/tv.css" />
  </head>
  <body data-surface="tv">
    <header id="review">
      <strong>红果 TV / 设计审阅</strong
      ><label
        >页面
        <select id="review-screen"></select></label
      ><label
        >状态
        <select id="review-state"></select></label
      ><label
        >外观
        <select id="review-theme">
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select></label
      ><label
        >字号
        <select id="review-font">
          <option value="1">100%</option>
          <option value="1.15">115%</option>
          <option value="1.3">130%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select></label
      ><label
        >安全区
        <select id="review-safe">
          <option value="standard">标准</option>
          <option value="overscan">保守 5%</option>
        </select></label
      ><button id="review-hide">隐藏工具栏</button
      ><output id="review-metrics" aria-label="画布适配"></output
      ><span>公开目录 · 个人记录、播放与账号为样例</span>
    </header>
    <div id="viewport">
      <div id="tv-stage">
        <main id="tv" aria-label="红果 TV 设计原型"></main>
        <div id="toast" role="status"></div>
        <span id="type-scale-probe" aria-hidden="true"></span>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <script src="assets/catalog.js"></script>
    <script src="shared/icons.js"></script>
    <script src="shared/controls.js"></script>
    <script src="assets/tv.js"></script>
  </body>
</html>
