<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>红果短剧 · Android TV / 1920×1080</title>
    <link rel="stylesheet" href="assets/theater.css" />
    <link rel="stylesheet" href="assets/tv.css" />
  </head>
  <body data-device="tv">
    <div id="preview-nav"></div>
    <div class="tv-viewport">
      <main class="tv-stage" id="tv-stage" data-od-id="android-tv-stage">
        <header class="tv-header" data-od-id="tv-navigation">
          <a class="brand" href="tv.html"
            ><span class="brand-lockup"><img
              class="brand-logo brand-logo-base"
              src="assets/media/brand-logo.png"
              width="216"
              height="64"
              alt="红果短剧"
            /><img
              class="brand-logo brand-logo-color"
              src="assets/media/brand-logo.png"
              width="216"
              height="64"
              alt=""
              aria-hidden="true"
            /></span></a>
          <nav class="tv-nav" aria-label="电视导航">
            <button data-tv-route="home" class="tv-nav-item active">发现</button
            ><button data-tv-route="browse" class="tv-nav-item">找剧</button
            ><button data-tv-route="rankings" class="tv-nav-item">排行榜</button
            ><button data-tv-route="history" class="tv-nav-item">
              观看记录</button
            ><button data-tv-route="favorites" class="tv-nav-item">收藏</button>
          </nav>
          <div class="row">
            <button
              class="btn ghost icon-btn"
              data-tv-action="search"
              aria-label="搜索"
            >
              <i data-icon="search"></i></button
            ><button
              class="btn ghost icon-btn"
              data-tv-route="settings"
              aria-label="设置"
            >
              <i data-icon="settings-2"></i></button
            ><span class="tv-clock">21:08</span>
          </div>
        </header>
        <div id="tv-main"></div>
        <footer class="tv-help" data-od-id="remote-help">
          <span
            >方向键 移动焦点 <span class="help-sep">·</span> 确认 进入
            <span class="help-sep">·</span> 返回 / Esc 返回</span>
        </footer>
        <div id="tv-overlay"></div>
      </main>
    </div>
    <div id="toast-region" role="status" aria-live="polite"></div>
    <script src="assets/catalog.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/inspect.js"></script>
    <script src="assets/tv.js"></script>
  </body>
</html>
